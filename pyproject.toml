[tool.poetry]
name = "epistemic-fortitude"
version = "0.1.0"
description = "A multi-agent AI system with principled knowledge confidence"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "epistemic_fortitude"}]

[tool.poetry.dependencies]
python = "^3.10"
google-adk = "^1.0"
google-genai = "^1.0.0"
langgraph = ">=0.2.0"
langchain = ">=0.3.0"
langchain-google-genai = ">=2.0.0"
langchain-openai = ">=0.2.0"
langchain-core = ">=0.3.0"
python-dotenv = "^1.0.0"
deprecated = "^1.2.14"
datasets = "^3.2.0"
scipy = ">=1.10,<2.0"
numpy = ">=1.24,<2.0"
# ... other deps ...
langchain-community = "^0.3.0"   # Keeps Numpy 1.x
langchain-anthropic = "^0.3.0"   # <--- CHANGE THIS (Was ^1.3.1)
langchain-together = "^0.3.1"
matplotlib = "^3.10.8"
seaborn = "^0.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
